[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elastiqa"
version = "0.1.0"
description = "Phase-coherent time stretching and pitch shifting, with a reproducible TSM benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dsp", "phase-vocoder", "time-stretching", "pitch-shifting", "stft", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
viz = ["matplotlib>=3.5"]
app = ["gradio>=4.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "matplotlib>=3.5", "soundfile>=0.12"]

[tool.setuptools.packages.find]
include = ["elastiqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
